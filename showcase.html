<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Inside the kitchen · Kitchen Studio</title><style>

4px}header{padding:18px}.brand{font-size:16px}.brand img{width:28px;height:28px}.link{font-size:12px}.copy h1{font-size:22px}.copy p{font-size:11px}footer{left:16px;right:16px;bottom:16px;display:block}.copy{padding:12px 14px;max-width:none}.controls{justify-content:flex-start;gap:5px;margin-top:10px;max-width:none}button{font-size:12px;padding:9px 12px}#status{left:18px;top:78px}#joy{bottom:200px}}
</style></head><body><header><div class="brand"><img src="/logo-icon.svg" alt=""><span>Kitchen Studio<small>Inside the kitchen</small></span></div><nav style="display:flex;gap:16px;align-items:center"><a class="link" href="/equipment/">Equipment detail</a><a class="link" href="/app/">Planner ↗</a></nav></header><main class="stage" id="stage"><canvas id="scene" aria-label="Interactive commercial kitchen. Drag to orbit; use the buttons to change view."></canvas></main><div id="status" role="status">Preparing the kitchen…</div><div id="joy" hidden aria-label="Walk direction"><div id="joyNub"></div></div><footer><div class="copy"><h1>Step into your next kitchen.</h1><p id="hint">Drag to explore. Scroll or pinch to get closer.<br>Development preview · Equipment shapes are illustrative.</p></div><nav class="controls" aria-label="3D views"><button id="overview">Whole kitchen</button><button id="cooking">Cooking line</button><button id="prep">Prep area</button><button id="walk" class="primary" aria-pressed="false">Walk inside</button></nav></footer><script src="/app/vendor/three.min.js"></script><script src="/app/renderer.js"></script><script>
const KS_standOf=()=>({shelf:true,runners:true}),KS_drawerSecs=()=>0;
const example={room:{w:6200,d:4800,h:2900},items:[]};
const item=(id,sym,x,y,w,d,h,mount='floor',extra={})=>example.items.push({id,sym,x,y,w,d,h,mount,rot:0,opts:[],...extra});
item('cold','fridge',100,100,740,830,2010);
item('range','range',1150,100,1200,900,900);
item('fryer','fryer',2400,100,800,800,900);
item('griddle','griddle',3250,100,800,800,900);
item('stand','stand',4200,100,860,703,699);
item('combi','oven',4205,100,850,842,754,'top',{z:699,brand:'Rational',model:'iCombi Pro 6-1/1 E'});
item('hood','ss:hood',1050,0,3100,1100,500,'over',{z:2050,opts:['Lights','Baffle filters']});
item('rack','ss:rack',100,1250,1100,500,1800,'floor',{rot:270});
item('sink','ss:sink2',100,2650,1500,700,900,'floor',{rot:270,opts:['Upstand 100 mm','Undershelf']});
item('island','ss:table',2100,2450,1800,750,900,'floor',{opts:['Undershelf']});
item('chef','arch:person',4200,2300,700,500,1900,'arch',{rot:20});
const status=document.getElementById('status');
if(KS3D.init(document.getElementById('stage'),document.getElementById('scene'),()=>{})){
 KS3D.rebuild(example,null,{sunk:'#111820'},i=>i.z||0,i=>i.sym,i=>i.rot%180?i.d:i.w,i=>i.rot%180?i.w:i.d);KS3D.resetOrbit();KS3D.draw();KS3D.bindJoy(document.getElementById('joy'),document.getElementById('joyNub'));
 KS3D.ready().then(()=>{status.textContent=KS3D.assetStatus==='ready'?'':"The chef couldn’t load. The kitchen is ready to explore.";});
}else status.textContent='3D is unavailable in this browser. Please try a browser with WebGL enabled.';
function walk(on){KS3D.setMode(on?'walk':'orbit');document.getElementById('joy').hidden=!on;document.getElementById('walk').textContent=on?'Exit walkthrough':'Walk inside';document.getElementById('walk').setAttribute('aria-pressed',String(on));document.getElementById('hint').textContent=on?'Drag to look. Use the pad or W/A/S/D to move.':'Drag to explore. Scroll or pinch to get closer. Development preview · Equipment shapes are illustrative.';}
document.getElementById('walk').onclick=()=>walk(KS3D.mode!=='walk');document.getElementById('overview').onclick=()=>{walk(false);KS3D.resetOrbit();KS3D.draw();};
document.getElementById('cooking').onclick=()=>{walk(false);KS3D.focus({x:3,y:1.15,z:.8,r:4.9,th:.18,ph:1.13});};document.getElementById('prep').onclick=()=>{walk(false);KS3D.focus({x:2.5,y:1,z:2.8,r:4.6,th:.65,ph:1.08});};window.addEventListener('resize',()=>KS3D.resize());
</script></body></html>
